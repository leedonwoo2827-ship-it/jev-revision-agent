<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEV 개정 에이전트</title>
<style>
:root{
  --rail:#201e1b;--rail-fg:#efece5;--rail-mute:#b3aca1;--rail-dim:#8a8378;--rail-brand:#de886b;--rail-hover:#302e2b;--rail-active:#3b2d26;--rail-line:rgb(255 255 255/.09);
  --paper:#f7f5f1;--card:#fffdfa;--fg:#24211d;--mute:#6b645a;--line:#e4ded4;--brand:#9a4d33;--wash:#efe7e1;
  --ok:#2f6b3a;--okbg:#e5f1e3;--bad:#b42318;--badbg:#fbe9e6;--log:#1b1916;--logfg:#e6e0d6;
  --del:#ffc4bb;--delfg:#9b1c10;--ins:#a8ebb6;--insfg:#11602a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161412;--card:#1e1c19;--fg:#ece7df;--mute:#a59d91;--line:#34302b;--brand:#e19a7d;--wash:#2c2420;--ok:#7cc98a;--okbg:#1d2a1f;--bad:#ff8a7a;--badbg:#3a201c;--log:#0f0e0c;
  --del:#5a2620;--delfg:#ffb4a8;--ins:#1f4a2a;--insfg:#9be3ad}}
:root[data-theme="dark"]{--paper:#161412;--card:#1e1c19;--fg:#ece7df;--mute:#a59d91;--line:#34302b;--brand:#e19a7d;--wash:#2c2420;--ok:#7cc98a;--okbg:#1d2a1f;--bad:#ff8a7a;--badbg:#3a201c;--log:#0f0e0c;
  --del:#5a2620;--delfg:#ffb4a8;--ins:#1f4a2a;--insfg:#9be3ad}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--fg);font:13.5px/1.6 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;display:flex}
/* rail */
.rail{width:252px;flex:none;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--rail-line)}
.brand b{font-size:16px;letter-spacing:-.2px}
.pill{background:#b9542f;color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:5px 10px}
.brand small{display:block;color:var(--rail-dim);font-size:11.5px;margin-top:6px}
.newbook{display:block;width:100%;margin-top:12px;background:var(--rail-brand);border:0;color:#2a1a12;font-weight:800;font-size:15px;border-radius:22px;padding:10px 0}
.newbook:hover{background:#e89a7f}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav a{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;margin:1px 0}
.nav a:hover{background:var(--rail-hover)}
.nav a.on{background:var(--rail-active);box-shadow:inset 3px 0 0 var(--rail-brand)}
.nav a.off{opacity:.45}
.nav-no{font-weight:800;color:var(--rail-brand);min-width:20px;font-variant-numeric:tabular-nums}
.nav-t{flex:1;min-width:0}
.nav-t em{display:block;font-style:normal;font-size:11.5px;color:var(--rail-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sec{color:var(--rail-dim);font-size:11px;letter-spacing:.5px;padding:12px 10px 4px}
.chip{font-size:10.5px;border-radius:9px;padding:0 6px;background:rgb(255 255 255/.08);color:var(--rail-mute);white-space:nowrap}
.chip.ok{background:#2f4a33;color:#bfe3c3}.chip.warn{background:#4a3a26;color:#f1cf9c}
.rail-foot{border-top:1px solid var(--rail-line);padding:10px 14px;font-size:11.5px;color:var(--rail-dim)}
.rail-foot .bar{background:rgb(255 255 255/.1)}
.cxbtn{cursor:pointer;color:var(--rail-fg);padding:6px 8px;margin:0 -8px 6px;border-radius:8px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cxbtn:hover{background:var(--rail-hover)}
.cxmail{color:var(--rail-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cxmenu{background:var(--rail-hover);border-radius:8px;padding:8px 10px;margin:-2px -8px 8px;color:var(--rail-mute);overflow-wrap:anywhere}
.cxmenu button{background:transparent;color:var(--rail-fg);border-color:var(--rail-line);padding:3px 9px;font-size:12px}
.cxmenu button:hover{background:var(--rail-active)}
.engsel{width:100%;margin:2px 0 8px;background:var(--rail-hover);color:var(--rail-fg);border-color:var(--rail-line);font-size:12px}
/* main */
main{flex:1;min-width:0;height:100vh;overflow:auto}
.wrap{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
h1{font-size:20px;margin:0}
.sub{color:var(--mute);margin:2px 0 14px;overflow-wrap:anywhere}
main{overflow-x:hidden}
.nav-t{overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h2{font-size:14.5px;margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:0 4px}
.mute{color:var(--mute)}
button,select,input{font:inherit;color:var(--fg)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--wash)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;margin:6px 0}
.drop.drag{border-color:var(--brand);background:var(--wash)}
.drop .name{font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{border-radius:8px}
.tabs button.on{background:var(--wash);border-color:var(--brand);color:var(--brand);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
pre.log{background:var(--log);color:var(--logfg);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;font:12px/1.5 Consolas,"D2Coding",monospace;white-space:pre-wrap;margin:0}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle;font-size:13px}
th{color:var(--mute);font-weight:600}
td input[type=text]{width:100%}
td input[type=number]{width:72px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-width:110px;background:var(--paper)}
.kpi b{display:block;font-size:19px}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stage{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);cursor:pointer}
.stage:hover{border-color:var(--brand)}
.stage b{display:block;font-size:12.5px}
.stage span{font-size:11.5px;color:var(--mute)}
iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.tag{font-size:11px;border-radius:9px;padding:1px 7px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.laws{font-size:12px;color:var(--mute);line-height:1.5}
#toast{position:fixed;right:18px;top:16px;background:var(--fg);color:var(--paper);padding:9px 34px 9px 16px;border-radius:10px;display:none;max-width:min(460px,90vw);z-index:9;cursor:pointer;box-shadow:0 6px 24px rgb(0 0 0/.18)}
#toast::after{content:"✕";position:absolute;right:12px;top:9px;opacity:.6}
.alert{border:1px solid var(--bad);background:var(--badbg);color:var(--fg);border-radius:10px;padding:10px 14px;margin:8px 0;position:relative}
.alert b{color:var(--bad)}
.alert .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:15px;padding:2px 6px}
.alert code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:12.5px Consolas,"D2Coding",monospace}
.alert details{margin-top:6px;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.lchip{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 9px;margin:2px 3px 2px 0;font-size:12px;cursor:pointer;background:var(--card);color:var(--mute);user-select:none;white-space:nowrap}
.lchip.on{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.lchip.add{border-style:dashed}
.iconbtn{padding:2px 7px;font-size:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.steps span{font-size:12px;color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
/* ④ 정오 판정 · ⑤ 정오표 받기 */
button.big{font-size:14.5px;padding:9px 18px}
select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px}
.seg button.on{background:var(--brand);color:#fff}
.dash a{color:var(--fg)}.dash a:hover{color:var(--brand)}
.dash tr.cur td{background:var(--wash)}.dash tr.sub td{font-size:12.5px;border-bottom-style:dashed;padding-top:3px;padding-bottom:3px}.dash td{vertical-align:middle}
.tag.plain{background:var(--paper);color:var(--mute);border:1px solid var(--line)}.tag.bad{background:var(--badbg);color:var(--bad)}
.note{background:var(--wash);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:13px}
.grid2{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 12px;align-items:start}
.para{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.para:last-child{border-bottom:0}
.para .no{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;text-align:right;font-size:12px}
.para.off .body{opacity:.6}
.para .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.para .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.para label.adopt{display:inline-flex;gap:5px;align-items:center;font-weight:700;cursor:pointer}
.para details{margin-top:6px}
.para details summary{cursor:pointer;color:var(--mute);font-size:12px}
.para .quote{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;color:var(--mute)}
b.mx{background:var(--del);color:var(--delfg);border-radius:2px;padding:0 1px}b.my{background:var(--ins);color:var(--insfg);border-radius:2px;padding:0 1px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.dl a{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit;background:var(--card)}
.dl a:hover{border-color:var(--brand)}
.dl a b{display:block;font-size:15px;margin-bottom:3px}
.dl a span{font-size:12px;color:var(--mute)}
.dl a.main{border:2px solid var(--brand)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:820px){body{display:block}.rail{width:auto;height:auto;position:static}.nav{max-height:240px}main{height:auto}.stages{grid-template-columns:repeat(3,1fr)}.wrap{padding:16px}}
</style></head>
<body>
<nav class="rail">
  <div class="brand"><div class="row" style="gap:8px"><span class="pill">JEV 개정</span><b>에이전트</b></div>
    <small>Judge · Evidence · Verdict — 법령이 바뀌면 우리 책 어디를 고칠지</small>
    <button class="newbook" onclick="newBook()">＋ 새 책 넣기</button></div>
  <div class="nav" id="nav"></div>
  <div class="rail-foot" id="foot"></div>
</nav>
<main><div class="wrap" id="view"></div></main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtYmd = d => /^\d{8}$/.test(d||"") ? `${+d.slice(0,4)}. ${+d.slice(4,6)}. ${+d.slice(6)}.` : (d||"");
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+"MB" : Math.max(1, Math.round(n/1024))+"KB";
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json().catch(()=>({error:"응답 오류"})); if(!r.ok || j.ok===false) throw new Error(j.error||r.status); return j };
function toast(t, ms=3500){ const e=$("toast"); e.textContent=t; e.style.display="block"; e.onclick=()=>e.style.display="none"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",ms) }

let APP = null, CHS = null, ERR = null, DEC = {}, TOCDRAFT = null, timer = null, wasRunning = false, logSig = "";
const route = () => { const h = location.hash;
  let m = h.match(/^#\/ch\/(\w+)/); if(m) return {view:"ch", id:m[1]};
  m = h.match(/^#\/(judge|result|errata|download)/); return m ? {view:m[1]} : {view:"book"} };

async function refresh(){
  try{
    APP = await api("/api/state");
    const r = route();
    if(r.view === "ch") CHS = await api("/api/ch?id="+r.id).catch(e=>{toast(e.message); location.hash="#/book"; return null});
    if((r.view === "errata" || r.view === "download") && !ERR){ ERR = await api("/api/errata"); DEC = JSON.parse(JSON.stringify(ERR.decisions)) }
    renderNav(); renderView(false);
  }catch(e){ $("view").innerHTML = `<div class="empty">서버에 연결할 수 없습니다. run.bat 창이 열려 있는지 확인하세요.</div>` }
  clearTimeout(timer); timer = setTimeout(refresh, APP && (APP.job.running || [APP.codex, APP.claude].some(c => c && (c.checking || c.login_open))) ? 1200 : 6000);
}

const STAGE_NAV = [["book","①","책 넣기 · 차례"],["judge","②","장별 판정"],["result","③","판정 결과"],["errata","④","정오 판정"],["download","⑤","정오표 받기"]];
const judged = () => APP.chapters.filter(c=>c.result);
const xlsxTime = () => (APP.errata.files.find(f=>f.name.endsWith("_정오표.xlsx"))||{}).time;
function renderNav(){
  const r = route(), chs = APP.chapters, jd = judged();
  const sum = k => jd.reduce((a,c)=>a+c.result[k], 0);
  const sub = {book: APP.book ? esc(APP.book.file) : "교재 PDF 전체를 올리세요",
    judge: chs.length ? `${chs.length}장 중 ${jd.length}장 판정` : "차례를 확정하면 장이 나옵니다",
    result: jd.length ? `후보 ${sum("rows")} · 수정 권고 ${sum("revise")}` : "아직 판정 전",
    errata: "수정 후보마다 반영할지 체크",
    download: xlsxTime() ? `${esc(xlsxTime())}에 만듦` : "책 전체 한 번에"};
  // 레일은 ①~⑤ 단계만. 장은 ② 장별 판정 표와 장 화면의 이전/다음으로 오간다
  $("nav").innerHTML = STAGE_NAV.map(([k,no,t])=>`<a href="#/${k}" class="${r.view===k||(k==="judge"&&r.view==="ch")?"on":""}"><span class="nav-no">${no}</span><span class="nav-t">${t}<em>${sub[k]}</em></span></a>`).join("");
  const j = APP.job;
  $("foot").innerHTML = engineFoot() + acctFoot("codex") + acctFoot("claude") + (j.name ? `<div>${j.running ? "⏳" : (j.error ? "⚠" : "✓")} ${esc(j.name)}${j.ch ? " · "+j.ch+"장" : ""}${j.waiting ? " · ⏸ "+esc(j.waiting)+" 재시도" : ""}</div><div class="bar"><i style="width:${progress(j)}%"></i></div>` : "")
    + `<div title="${esc(APP.workspace)}">워크스페이스: ${esc(APP.workspace.split(/[\\/]/).slice(-2).join("/"))}</div>`;
  if(wasRunning && !j.running) toast(j.error ? (j.error_kind==="auth" ? "⚠ Codex 로그인 만료 — 화면의 안내를 확인하세요" : "⚠ "+j.name+" 중단 — 화면의 안내를 확인하세요") : j.name+" 완료", 6000);
  wasRunning = j.running;
}

function progress(j){
  if(!j.name) return 0;
  if(!j.running) return 100;
  if(j.name === "개정사항 판정"){
    const tot = j.log.map(l=>l.match(/대조 단위 (\d+)건을/)).find(Boolean);
    const done = j.log.filter(l=>/^\s*\[(판정|cache|오류)\]/.test(l)).length;
    return tot ? Math.min(97, 8 + 88*done/(+tot[1]||1)) : 5;
  }
  if(/^일괄/.test(j.name)){
    const k = j.log.map(l=>l.match(/^\[일괄\] (\d+)\/(\d+)장/)).filter(Boolean).pop();
    return k ? Math.min(97, 100*(k[1]-.5)/k[2]) : 3;
  }
  return 45;
}

function renderView(force=true){
  const r = route();
  if(r.view === "book") return renderBook(force);
  if(r.view === "ch") return CHS && renderChapter(force);
  if(r.view === "judge") return renderJudge(force);
  if(r.view === "result") return renderResultPage(force);
  if(ERR) return r.view === "errata" ? renderErrata(force) : renderDownload(force);
}

/* ---------- 0. 책 넣기 · 차례 ---------- */
const METHOD = {outline:"PDF 책갈피", contents:"책 앞 차례 쪽", contents_skip_outline:"책 앞 차례 쪽 (PDF 책갈피는 파일 이름뿐이라 쓰지 않음)", codex:"Codex", none:"찾지 못함"};
let LAWDRAFT = null, LAWDIRTY = false;
const lawShort = n => { const m = n.match(/^(.*?)\s*(시행령|시행규칙)$/); return m ? m[2] : n };
const lawFam = n => n.replace(/\s*(시행령|시행규칙)$/, "").replace(/\s/g,"");

function syncDrafts(t){
  if(t && (!TOCDRAFT || TOCDRAFT.book !== t.book || TOCDRAFT._src !== JSON.stringify(t.chapters))) {
    TOCDRAFT = JSON.parse(JSON.stringify(t)); TOCDRAFT._src = JSON.stringify(t.chapters);
    TOCDRAFT.chapters.forEach(c => c.law_names = (c.laws||[]).map(l=>l.name));
  }
  const bl = (t && t.baseline) || {laws:[], suggest:[]};
  const sig = JSON.stringify([t && t.book, bl.laws, bl.suggest, bl.date]);
  if(t && (!LAWDRAFT || (!LAWDIRTY && LAWDRAFT._sig !== sig))) {
    LAWDRAFT = {_sig: sig, laws: JSON.parse(JSON.stringify(bl.laws||[])), suggest: JSON.parse(JSON.stringify(bl.suggest||[])), date: fmtYmd(bl.date)};
    LAWDIRTY = false;
  }
}

function renderBook(force){
  const t = APP.toc, j = APP.job;
  if(!force && document.activeElement && document.activeElement.closest("#toctable, #lawtable")) { updateJobBox("bookjob"); return }
  syncDrafts(t);
  const bl = (t && t.baseline) || {};
  const onLaws = LAWDRAFT ? LAWDRAFT.laws.filter(l=>l.checked!==false) : [];
  $("view").innerHTML = `
  <h1>① 책 넣기 · 차례</h1>
  <div class="sub">① 교재 PDF 전체를 넣고 → ② 이 책에서 확인할 법령(법·시행령·시행규칙)을 정하고 → ③ 장마다 쪽 범위와 연결 법령을 확인한 뒤 확정하면 장별 워크스페이스가 만들어집니다.</div>
  <div id="bookjob"></div>
  <div class="card">
    <h2><span class="n">1</span>교재 PDF 전체</h2>
    <div class="drop" id="bookdrop">
      <div><div class="name">${APP.book ? `<span class="ok">✔ ${esc(APP.book.file)}</span> <span class="mute">${kb(APP.book.size)}${t?` · ${t.page_count}쪽`:""}</span>` : `<span class="bad">✖ 아직 없음</span>`}</div>
      <div class="mute">이 화면 아무 곳에나 끌어다 놓거나 [선택] — 쪼개지 말고 원본 그대로 (PDF)</div></div>
      <div><input type="file" id="bookfile" accept=".pdf" hidden><button onclick="$('bookfile').click()">선택</button></div>
    </div>
  </div>
  ${t ? `
  <div class="card">
    <h2><span class="n">2</span>이 책의 법령 <span class="mute" style="font-weight:400">— ${
      bl.source==="법령적용기준" ? `책 p.${bl.page} [법령적용기준]에서 찾음`

function lawChips(c, i, onLaws){
  const names = c.law_names || [];
  const extra = names.filter(n=>!onLaws.some(l=>l.name===n));  // 목록에서 빠졌지만 아직 연결된 것
  const all = [...onLaws.map(l=>l.name), ...extra];
  if(!all.length) return '<span class="mute">— (개정기본서 대조로 진행)</span>';
  let prevFam = null;
  return all.map((n,k)=>{ const fam = lawFam(n), lbl = fam===prevFam ? lawShort(n) : n; prevFam = fam;
    return `<span class="lchip ${names.includes(n)?"on":""}" title="${esc(n)}" onclick="toggleLaw(${i}, ${k})">${esc(lbl)}</span>` }).join("")
    + (names.length ? "" : '<div class="mute" style="font-size:11.5px">모두 꺼져 있으면 개정기본서 대조로 진행</div>')
    + sugChips(c, i);
}
// AI 장별 법령 찾기 제안 — 아직 이 장에 안 켜진 것만. 누르면 이 책의 법령 목록에 넣고(책 기준 판 자동) 이 장에 켠다.
function sugChips(c, i){
  const sug = (c.law_suggest||[]).filter(x=>!(c.law_names||[]).includes(x.name));
  if(!sug.length) return "";
  return `<div style="margin-top:4px;font-size:11.5px"><span class="mute">AI 제안 · 누르면 켜기:</span> ` + sug.slice(0,8).map((x,k)=>{
    const tip = `${x.reason||""}${x.pages&&x.pages.length?` (p.${x.pages.join(", ")})`:""}\n현행 ${x.cur_header||"?"}${x.header?`\n책 기준 ${x.header}`:""}${x.note?`\n${x.note}`:""}`;
    const tag = x.changed ? '<b class="bad">책 이후 개정</b>' : '<span class="mute">개정 없음</span>';
    return `<span class="lchip add" title="${esc(tip)}" onclick="useSuggest(${i}, '${esc(x.name).replace(/'/g,"\\'")}')">＋ ${esc(x.name)} <span class="mute">${Math.round(x.conf*100)}%</span> ${tag}</span>`;
  }).join("") + (sug.length > 8 ? ` <span class="mute">외 ${sug.length-8}개</span>` : "") + `</div>`;
}
async function useSuggest(i, name){
  const c = TOCDRAFT.chapters[i];
  try{
    if(!LAWDRAFT.laws.some(l=>l.name===name)){
      toast(`${name}을(를) 이 책의 법령에 넣고 책 기준 판을 법제처 연혁에서 찾는 중…`, 6000);
      const j = await api("/api/book/law-add",{method:"POST",body:JSON.stringify({names:[name]})});
      const keep = TOCDRAFT; APP.toc = j.toc; LAWDRAFT = null; syncDrafts(j.toc); TOCDRAFT = keep;  // 화면에서 고친 차례 초안은 그대로
    }
    c.law_names = [...new Set([...(c.law_names||[]), name])]; renderView(true);
  }catch(e){ toast("실패: "+e.message, 8000) }
}
async function lawScan(){
  if(LAWDIRTY) await saveLaws(false);
  const n = (APP.toc.chapters||[]).filter(c=>c.include).length;
  if(!confirm(`제목이 법 이름이 아닌 장마다 판정 엔진(${APP.engines[APP.settings.engine]})을 한 번씩 부릅니다 (최대 ${n}번, 장마다 1~2분).\n다시 누르면 이미 읽은 장은 다시 부르지 않습니다. 진행할까요?`)) return;
  try{ await api("/api/book/law-scan",{method:"POST"}); toast("AI로 장별 법령을 찾는 중입니다. 끝나면 ③에 「AI 제안」이 뜹니다."); refresh() }catch(e){ toast(e.message, 8000) }
}
function toggleLaw(i, k){
  const onLaws = LAWDRAFT.laws.filter(l=>l.checked!==false).map(l=>l.name);
  const c = TOCDRAFT.chapters[i], names = c.law_names || [];
  const n = [...onLaws, ...names.filter(x=>!onLaws.includes(x))][k];
  c.law_names = names.includes(n) ? names.filter(x=>x!==n) : [...names, n]; renderView(true);
}
function addRow(i){
  const base = TOCDRAFT.chapters[i] || {no:0, pages:[1,1]};
  const row = {id:"", no:(base.no||0)+1, kind:"chapter", title:"", printed:null, pages:[base.pages[1]+1, base.pages[1]+1], include:true, laws:[], law_names:[...(base.law_names||[])]};
  TOCDRAFT.chapters.splice(i+1, 0, row); renderView(true);
}
function delRow(i){ const c = TOCDRAFT.chapters[i];
  if(!confirm(`${c.no??""} ${c.title||"(제목 없음)"} 행을 지울까요? (확정 전까지는 저장되지 않습니다)`)) return;
  TOCDRAFT.chapters.splice(i,1); renderView(true) }
function lawDirty(rerender=true){ LAWDIRTY = true; if(rerender) renderView(true) }
function addLaw(){
  const name = $("newlaw").value.trim().replace(/\s+/g," "); if(!name) return;
  const fam = name.replace(/\s*(시행령|시행규칙)$/,"");
  const names = $("newlawfam").checked ? [fam, fam+" 시행령", fam+" 시행규칙"] : [name];
  for(const n of names) if(!LAWDRAFT.laws.some(l=>l.name.replace(/\s/g,"")===n.replace(/\s/g,""))) LAWDRAFT.laws.push({name:n, version:"", checked:true});
  lawDirty();
}
function addSuggest(i){ const x = LAWDRAFT.suggest.splice(i,1)[0]; LAWDRAFT.laws.push({name:x.name, version:"", checked:true}); lawDirty() }
async function saveLaws(reattach){
  if(LAWDRAFT.laws.some(l=>!l.version && l.checked!==false)) toast("버전이 빈 법령을 법제처 연혁에서 찾는 중입니다 (법령당 몇 초)", 8000);
  try{ const j = await api("/api/book/laws",{method:"POST",body:JSON.stringify({laws:LAWDRAFT.laws, reattach, date:LAWDRAFT.date||""})});
    LAWDIRTY = false; LAWDRAFT = null; if(reattach) TOCDRAFT = null;
    APP.toc = j.toc; renderView(true);
    toast(reattach ? "법령 목록을 저장하고 장마다 다시 연결했습니다. 아래 차례에서 확인 후 확정하세요." : "법령 목록을 저장했습니다.", 5000);
  }catch(e){ toast("실패: "+e.message, 8000) }
}
async function fetchBookLaws(){
  if(LAWDIRTY) await saveLaws(false);
  try{ await api("/api/book/laws-fetch",{method:"POST"}); toast("법제처에서 법령을 받는 중입니다 (법령당 몇 초)"); refresh() }catch(e){ toast(e.message, 8000) }
}

let ALERT_OFF = "";

  const cauth = j.error_kind === "claude_auth", limit = j.error_kind === "limit";

  return `<div class="alert"><button class="x" title="닫기" onclick="closeAlert('${esc(sig)}')">✕</button>
    ${cauth ? `<b>⚠ 이 PC의 Claude 로그인이 만료됐습니다.</b> (${esc(j.name)})
      <div class="row" style="margin-top:8px"><button class="primary" onclick="acctLogin('claude')">Claude 다시 로그인</button>
        <span>브라우저가 열리면 Claude 계정으로 로그인한 뒤 다시 누르세요. 끝난 조문은 이어서 합니다.</span></div>
      <details><summary>원문 오류 보기</summary>${esc(raw)}</details>`
    : limit ? `<b>⏸ 사용 한도에 걸려 멈췄습니다.</b> (${esc(j.name)})<div style="margin-top:4px;overflow-wrap:anywhere">${esc(j.error)}</div>
      <div class="row" style="margin-top:8px">${engineSelect("")}<span class="mute">엔진을 바꾸고 같은 버튼을 다시 누르면 끝난 조문 다음부터 이어서 합니다.</span></div>`
    : j.error_kind === "cancel" ? `<b>■ 멈췄습니다.</b> 끝난 조문은 기억해 두므로 다시 누르면 이어서 합니다.`
    : auth ? `<b>⚠ 이 PC의 Codex 로그인이 만료됐습니다.</b> (${esc(j.name)})
      <div class="row" style="margin-top:8px"><button class="primary" onclick="codexLogin(true)">Codex 다시 로그인</button>
        <span>브라우저가 열리면 ChatGPT 계정으로 로그인한 뒤, 같은 버튼을 다시 누르세요. (왼쪽 아래 Codex 메뉴에서도 할 수 있습니다)</span></div>
      <details><summary>직접 하려면</summary>명령창(cmd)에서 <code>codex logout</code> 다음 <code>codex login</code> — 또는 프로그램 폴더의 <b>codex-다시로그인.bat</b>.
        <button class="iconbtn" onclick="copyLogin()">명령 복사</button><br>'codex login status'가 로그인됨이라고 해도 토큰이 만료됐을 수 있습니다.</details>
      ${j.name==="AI로 차례 뽑기" ? `<div class="mute" style="margin-top:4px">차례는 AI 없이도 아래 표에서 직접 고칠 수 있습니다.</div>` : ""}
      <details><summary>원문 오류 보기</summary>${esc(raw)}</details>`
    : `<b>⚠ ${esc(j.name)} 작업이 멈췄습니다.</b><div style="margin-top:4px;overflow-wrap:anywhere">${esc(j.error)}</div>`}</div>`;
}

/* ---------- 판정 엔진 · 계정 (좌하단): Codex(ChatGPT) · Claude ---------- */
const ACCT = {codex:{name:"Codex", who:"ChatGPT"}, claude:{name:"Claude", who:"Claude"}};
const MENU = {codex:false, claude:false}, SEEN = {};
function engineSelect(cls){
  return `<select class="${cls}" onchange="saveSettings({engine:this.value})" title="판정에 쓸 AI (이 PC에만 저장)">${Object.entries(APP.engines).map(([k,v])=>`<option value="${k}" ${APP.settings.engine===k?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
}
function engineFoot(){ return `<div style="color:var(--rail-mute)">판정 엔진</div>${engineSelect("engsel")}` }
function acctFoot(k){
  const c = APP[k] || {}, A = ACCT[k], e = APP.settings.engine;
  const used = e === k || (e === "auto" && k === "codex");  // 쓰는 엔진이 막혔을 때만 메뉴를 저절로 연다
  if(used && c.verified === false && SEEN[k] !== c.checked_at){ MENU[k] = true; SEEN[k] = c.checked_at }
  const busy = c.checking || c.login_open;

const cid = () => route().id;
/* 파일 이름으로 칸 찾기: 법제처 저장 파일명엔 법령번호가 들어 있다 (예: 소상공인기본법(법률)(제17623호)(20201208).pdf) */
function autoSlot(name){
  const slots = CHS.slots, n = name.replace(/\s/g,"");
  if(slots.length===1) return slots[0].slot;
  // 파일 이름에 들어 있는 가장 긴 법령 이름 (예: '경비업법시행규칙' > '경비업법')
  const named = slots.filter(x=>x.law && n.includes(x.law.replace(/\s/g,"")));
  const longest = Math.max(0, ...named.map(x=>x.law.length));
  let cand = named.filter(x=>x.law.length===longest);
  if(!cand.length) cand = slots.filter(x=> /시행규칙|부령/.test(n) ? x.abbr[0]==="칙" : /시행령|대통령령/.test(n) ? x.abbr[0]==="영" : x.abbr[0]==="법");
  if(!cand.length) return null;
  const nums = n.match(/\d{4,6}/g) || [];
  const old = cand.find(x=>x.which==="old" && x.number && nums.includes(x.number));
  if(old) return old.slot;
  if(/구법|구판|개정전|책기준|old/i.test(n)) return (cand.find(x=>x.which==="old")||{}).slot;
  return (cand.find(x=>x.which==="new")||{}).slot;
}
async function dropMany(files){
  if(!files.length) return;
  const plan = files.map(f=>({f, slot:autoSlot(f.name)}));
  const miss = plan.filter(p=>!p.slot);
  for(const p of plan.filter(p=>p.slot)) await upload(p.slot, p.f, true);
  await refresh(); renderView(true);
  toast(`${plan.length-miss.length}개를 칸에 넣었습니다` + (miss.length ? ` · 칸을 못 찾은 파일: ${miss.map(p=>p.f.name).join(", ")} (해당 칸에 직접 놓아 주세요)` : ""), 7000);
}

const isBatch = j => /^일괄/.test(j.name||"");

  const m = j.log.map(l=>l.match(/^\[일괄\] \d+\/\d+장 — (\w+)/)).filter(Boolean).pop(); return m && m[1] };
const okTag = (t, title) => `<span class="tag" title="${esc(title||"")}">${t}</span>`;
const noTag = (t, title) => `<span class="tag plain" title="${esc(title||"")}">${t}</span>`;
function slotRows(c){  // 2뎁스: 법령마다 책 기준(구) · 현행(신)
  if(c.mode === "book"){ const x = c.slots[0] || {};
    return `<tr class="sub"><td></td><td></td><td></td><td colspan="2">개정기본서 PDF</td>
      <td colspan="5">${x.file ? okTag("✔ "+esc(x.file)) : '<span class="bad">✖ 없음</span>'} <span class="mute">${c.ref_pages ? `쪽 ${c.ref_pages[0]}–${c.ref_pages[1]}` : "쪽 범위 미정"}</span></td></tr>` }
  const laws = [...new Set(c.slots.map(x=>x.law))];
  if(!laws.length) return `<tr class="sub"><td></td><td></td><td></td><td colspan="7" class="mute">연결된 법령이 없습니다. ① 차례에서 법령을 켜거나 장 화면에서 개정기본서 대조로 바꾸세요.</td></tr>`;
  const cell = (law, w) => { const x = c.slots.find(s=>s.law===law && s.which===w);
    return !x ? "" : x.file ? okTag("✔ "+esc(x.file), x.hint)
      : x.optional ? noTag("버전 모름 · 비교 안 함", "① 이 책의 법령에 책 기준 버전(공포번호,공포일)을 적거나 장 화면 구 칸에 파일을 넣으면 함께 비교합니다")
      : `<span class="bad" title="${esc(x.hint||"")}">✖ 없음</span>` };
  return laws.map(l=>`<tr class="sub"><td></td><td></td><td></td><td colspan="2">${esc(l)}</td>
    <td colspan="5"><span class="mute" style="font-size:11px">책 기준(구) </span>${cell(l,"old")} &nbsp; <span class="mute" style="font-size:11px">현행(신) </span>${cell(l,"new")}</td></tr>`).join("");
}
function renderJudge(force){
  const chs = APP.chapters, j = APP.job, run = j.running, cur = batchCur(j);
  for(const k of [...PICK]) if(!chs.some(c=>c.id===k)) PICK.delete(k);
  const key = JSON.stringify([chs, run, cur, j.stopping, j.waiting, [...PICK], [...FOLD], REDO, APP.settings, APP.codex, APP.claude]);
  if(!force && viewKey === key){ updateJobBox("alljob"); return }
  viewKey = key;
  const sel = chs.filter(c=>PICK.has(c.id)), dis = run ? "disabled" : "";
  const full = c => c.sources[1] && c.sources[0] === c.sources[1];
  const kpi = (t, v, sub) => `<div class="kpi"><span class="mute">${t}</span><b>${v}</b>${sub ? `<span class="mute" style="font-size:11.5px">${sub}</span>` : ""}</div>`;
  const jd = judged(), sum = k => jd.reduce((a,c)=>a+c.result[k], 0);
  const btn = (steps, label, cls="") => `<button class="${cls}" onclick='runSteps(${JSON.stringify(steps)})' ${run || !sel.length ? "disabled" : ""}>${label}</button>`;
  const row = c => `<tr class="${cur===c.id?"cur":""}">
    <td><input type="checkbox" ${PICK.has(c.id)?"checked":""} ${dis} onchange="pickCh('${c.id}',this.checked)"></td>
    <td><button class="iconbtn" style="border:0;background:none" onclick="foldCh('${c.id}')" title="법령별 자료 보기">${FOLD.has(c.id)?"▾":"▸"}</button></td>
    <td><b>${esc(c.id)}</b></td>
    <td><a href="#/ch/${c.id}">${esc(c.title)}</a> <span class="mute" style="font-size:12px">· p.${c.pages[0]}–${c.pages[1]}</span></td>
    <td class="mute" style="font-size:12px">${c.mode==="book" ? "기본서 대조" : "법령 비교"}</td>
    <td>${!c.sources[1] ? '<span class="mute">—</span>' : full(c) ? okTag(`✓ ${c.sources[0]}/${c.sources[1]}`) : `<span class="tag bad">${c.sources[0]}/${c.sources[1]}</span>`}</td>
    <td>${cur===c.id ? (j.waiting ? `<span class="tag plain" title="사용 한도 — 이 시각에 다시 해 봅니다">⏸ 한도 대기 ${esc(j.waiting)}</span>` : '<span class="tag plain">⏳ 하는 중</span>') : c.result ? okTag("✓ "+esc(c.result.updated)) + (c.result.failed ? ` <span class="tag bad">실패 ${c.result.failed}</span>` : "") : noTag("아직")}</td>
    <td class="num">${c.result ? `${c.result.rows} · <b>${c.result.revise}</b>` : '<span class="mute">-</span>'}</td>
    <td>${c.result && c.result.rows ? `<a href="#/errata" onclick="TAB='${c.id}';EF.show=200"><span class="tag plain" title="④에서 이 장 체크하기">${c.result.checked} / ${c.result.rows} →</span></a>` : '<span class="mute">-</span>'}</td>
    <td>${!c.result ? '<span class="mute">-</span>' : c.in_errata && !APP.errata.stale ? okTag("✓") : `<a href="#/download">${noTag(xlsxTime() ? "다시 만들기" : "아직")}</a>`}</td></tr>
    ${FOLD.has(c.id) ? slotRows(c) : ""}`;
  $("view").innerHTML = pageHead("② 장별 판정", "장마다 ①~⑤ 현황을 한눈에 봅니다. 장을 체크하고 단계 버튼을 누르면 고른 장에만 그 단계를 차례로 합니다. 장이 많으면 나눠 골라 시간대를 갈라 돌려도 됩니다. ▸를 누르면 그 장의 법령별 구·신 자료가 보입니다.")
  + acctLine() + (!chs.length ? noChapters() : `
    <div class="kpis">${kpi("장", chs.length+"장")}${kpi("1 비교 자료", chs.filter(full).length+" / "+chs.length, "다 찬 장")}${kpi("2 판정", jd.length+" / "+chs.length)}${kpi("3 후보 · 수정 권고", jd.length ? sum("rows")+" · "+sum("revise") : "-")}${kpi("4 체크", jd.length ? sum("checked")+"건" : "-")}${kpi("5 정오표", xlsxTime() ? (APP.errata.stale || jd.some(c=>!c.in_errata) ? "다시 만들기" : "✓") : "-", xlsxTime() ? esc(xlsxTime())+"에 만듦" : "아직 안 만듦")}</div>
    <div class="card">
      <div class="row" style="gap:6px">
        <b>고른 장에</b> <span class="mute">(${sel.length ? sel.length+"장: "+sel.map(c=>c.id).join(", ") : "아직 안 골랐어요"})</span>
        ${btn(["fetch"], "1 최근 법령 받기")}${btn(["judge"], "2 판정")}<span class="mute">|</span>${btn(["fetch","judge"], "▶ 1→2 받고 판정", "primary")}
        ${run && isBatch(j) ? `<button onclick="stopJob()" ${j.stopping?"disabled":""}>${j.stopping ? "멈추는 중…" : "■ 멈춤"}</button>` : ""}
        <label class="mute" title="이미 판정한 장을 다시 판정하면 그 장의 ④ 체크는 기본값으로 돌아갑니다"><input type="checkbox" ${REDO?"checked":""} onchange="REDO=this.checked;renderJudge(true)"> 판정한 장도 다시 판정</label>
      </div>
      <table class="dash" style="margin-top:10px"><thead><tr>
        <th style="width:28px"><input type="checkbox" ${chs.length && PICK.size===chs.length?"checked":""} ${dis} onchange="pickAllCh(this.checked)" title="모두"></th>
        <th style="width:28px"><button class="iconbtn" style="border:0;background:none" onclick="foldAll()" title="모두 펼치기/접기">${FOLD.size===chs.length?"▾":"▸"}</button></th>
        <th>장</th><th>제목</th><th>방식</th><th>1 비교 자료</th><th>2 판정</th><th class="num">3 후보 · 권고</th><th>4 체크</th><th>5 정오표</th></tr></thead>
        <tbody>${chs.map(row).join("")}</tbody></table>
      <div class="mute" style="margin-top:8px">「1 최근 법령 받기」는 법제처에서 현행을 새로 받고(같은 법령은 한 번만), 책 기준(구)판은 받아 둔 것을 씁니다. 개정기본서 대조 장은 받을 법령이 없어 건너뜁니다.
        「2 판정」은 비어 있는 법령 칸을 자동으로 채운 뒤 판정하고, 이미 판정한 장은 건너뜁니다. 자료가 모자란 장은 건너뛰고 끝에 알려 줍니다. 멈춤은 진행 중인 호출만 끝내 저장하고 바로 멈춥니다(끝난 조문은 다시 누르면 이어서).</div>
      <div id="alljob"></div></div>
    <div class="card"><h2>엔진 · 사용 한도 <span class="mute" style="font-weight:400">— 이 PC에만 저장됩니다</span></h2>
      <div class="grid2" style="grid-template-columns:70px minmax(0,1fr);align-items:center">
        <span>엔진</span><div class="row">${engineSelect("")}<span class="mute">Codex(ChatGPT)가 기본입니다. 자동 = Codex로 하다가 한도에 걸리면 Claude로(Claude CLI에 로그인된 PC만).</span></div>
        <span>한도면</span><div class="row">최대 <input type="number" min="0" max="48" step="1" value="${APP.settings.wait_hours}" style="width:70px" onchange="saveSettings({wait_hours:this.value})"> 시간까지 기다렸다가 같은 장부터 이어서
          <span class="mute">0 = 기다리지 않고 바로 멈춤. 기다리는 동안 콘솔 창(run.bat)은 켜 두세요(PC 절전은 막습니다).</span></div>
      </div></div>`);
  updateJobBox("alljob");
}
function pickCh(id, on){ on ? PICK.add(id) : PICK.delete(id); saveSet("jev.pick", PICK); renderJudge(true) }
function pickAllCh(on){ PICK = new Set(on ? APP.chapters.map(c=>c.id) : []); saveSet("jev.pick", PICK); renderJudge(true) }
function foldCh(id){ FOLD.has(id) ? FOLD.delete(id) : FOLD.add(id); saveSet("jev.open", FOLD); renderJudge(true) }
function foldAll(){ FOLD = new Set(FOLD.size === APP.chapters.length ? [] : APP.chapters.map(c=>c.id)); saveSet("jev.open", FOLD); renderJudge(true) }
async function runSteps(steps){
  const ids = APP.chapters.filter(c=>PICK.has(c.id)).map(c=>c.id);
  const names = {fetch:"최근 법령 받기", judge:"판정"};
  const again = steps.includes("judge") && REDO ? APP.chapters.filter(c=>PICK.has(c.id) && c.result).length : 0;
  if(!confirm(`${ids.length}장(${ids.join(", ")})에 「${steps.map(s=>names[s]).join(" → ")}」을(를) 차례로 합니다.`
    + (steps.includes("judge") ? "\n판정은 바뀐 조문마다 약 40초 · 기본서 대조는 4쪽마다 약 1분입니다." : "")
    + (again ? `\n⚠ 이미 판정한 ${again}장을 다시 판정합니다. 그 장의 ④ 체크는 기본값으로 돌아갑니다.` : "") + "\n계속할까요?")) return;
  try{ await api("/api/batch",{method:"POST",body:JSON.stringify({ids, steps, redo:REDO})}); toast("시작했습니다. 진행 상황은 아래 로그에 나옵니다.", 5000); refresh() }
  catch(e){ toast(e.message, 8000) }
}
async function stopJob(){ try{ await api("/api/stop",{method:"POST"}); toast("진행 중인 호출만 끝내고 멈춥니다. 끝난 조문은 저장됩니다.", 6000); refresh() }catch(e){ toast(e.message) } }

function renderResultPage(force){
  const chs = APP.chapters, jd = judged();
  const key = JSON.stringify(chs.map(c=>c.result));
  if(!force && viewKey === key) return;
  viewKey = key;
  const sum = k => jd.reduce((a,c)=>a+c.result[k], 0);
  $("view").innerHTML = pageHead("③ 판정 결과", "장마다 Codex가 찾은 책 영향 후보입니다. 수정확률 60% 이상이 「수정 권고」이고, ④ 정오 판정에서 처음부터 체크되어 있습니다.")
  + (!chs.length ? noChapters() : !jd.length ? `<div class="card empty">아직 판정한 장이 없습니다. <a href="#/judge">② 장별 판정</a>에서 판정을 돌리세요.</div>` : `
  <div class="kpis"><div class="kpi"><span class="mute">판정한 장</span><b>${jd.length} / ${chs.length}</b></div>
    <div class="kpi"><span class="mute">바뀐 조문 · 대조 구간</span><b>${sum("changes")}</b></div>
    <div class="kpi"><span class="mute">책 영향 후보</span><b>${sum("rows")}</b></div>
    <div class="kpi"><span class="mute">수정 권고</span><b>${sum("revise")}</b></div>
    <div class="kpi"><span class="mute">그대로 둠</span><b>${sum("rows")-sum("revise")}</b></div>
    ${sum("failed") ? `<div class="kpi"><span class="mute">판정 실패</span><b class="bad">${sum("failed")}</b></div>` : ""}</div>
  <div class="card"><table><thead><tr><th>장</th><th>제목</th><th>방식</th><th class="num">바뀐 조문</th><th class="num">후보</th><th class="num">수정 권고</th><th class="num">그대로</th><th class="num">실패</th><th>판정 시각</th><th></th></tr></thead><tbody>
    ${chs.map(c=>{ const r = c.result; return r ? `<tr><td><b>${esc(c.id)}</b></td><td><a href="#/ch/${c.id}">${esc(c.title)}</a></td><td>${c.mode==="book"?"기본서 대조":"법령 비교"}</td>
      <td class="num">${r.changes}</td><td class="num">${r.rows}</td><td class="num"><b>${r.revise}</b></td><td class="num">${r.rows-r.revise}</td>
      <td class="num ${r.failed?"bad":"mute"}">${r.failed}</td><td class="mute">${esc(r.updated)}</td>
      <td style="text-align:right"><button class="iconbtn" onclick="goErrata('${c.id}')" ${r.rows?"":"disabled"}>④ 체크하기</button></td></tr>`
      : `<tr class="mute"><td>${esc(c.id)}</td><td>${esc(c.title)}</td><td colspan="8"><a href="#/ch/${c.id}">아직 판정 전</a></td></tr>` }).join("")}
  </tbody></table></div>
  <div class="row"><button class="big primary" onclick="goErrata('all')">④ 정오 판정으로 →</button></div>`);
}

/* ---------- ④ 정오 판정 — 책 전체 수정 후보 · 체크 · 수정 문구 · 메모 ---------- */
let EF = {min:.2, show:200}, TAB = "all", decTimer = null;
const eOn = e => { const d = DEC[e.id]; return d && "apply" in d ? d.apply : e.on_default };
const eNew = e => { const d = DEC[e.id]; return d && d.new_text != null ? d.new_text : e.new };
const editsShown = () => ERR.rows.filter(e => e.p >= EF.min && (TAB === "all" || e.ch === TAB));
function goErrata(id){ TAB = id; EF.show = 200; location.hash = "#/errata" }
const errHead = t => pageHead(t, `판정한 장 ${ERR.chapters.length}개 · 후보 ${ERR.rows.length}건 · 체크 ${ERR.rows.filter(eOn).length}건 · 정오표는 늘 책 전체 한 번에 나옵니다.`,
  `<button onclick="openErrataDir()">폴더 열기</button>`);

function renderErrata(force){
  if(!force) return;  // 체크하는 동안 주기적 새로고침이 화면(펼친 근거 · 입력칸)을 덮지 않게
  if(TAB !== "all" && !ERR.chapters.some(c=>c.id===TAB)) TAB = "all";
  const tabs = ERR.chapters.length > 1 ? `<div class="seg" style="flex-wrap:wrap;margin:0 0 10px">${[["all","전체"], ...ERR.chapters.map(c=>[c.id, c.id+"장"])]
    .map(([k,t])=>`<button class="${TAB===k?"on":""}" onclick="TAB='${k}';EF.show=200;renderErrata(true)" title="${esc(k==="all"?"책 전체":(ERR.chapters.find(c=>c.id===k)||{}).title)}">${esc(t)}</button>`).join("")}</div>` : "";
  $("view").innerHTML = errHead("④ 정오 판정") + (ERR.rows.length ? tabs + editsCard()
    : `<div class="card empty">아직 판정한 장이 없습니다. <a href="#/judge">② 장별 판정</a>에서 판정을 돌리면 수정 후보가 여기에 나옵니다.</div>`);
}
function editsCard(){
  const all = ERR.rows, shown = editsShown(), on = all.filter(eOn).length;
  const opt = (v, t, cur) => `<option value="${v}" ${String(cur)===String(v)?"selected":""}>${esc(t)}</option>`;
  const ch = TAB !== "all" && ERR.chapters.find(c=>c.id===TAB);
  return `<div class="card"><h2>수정 후보 · 체크 <span class="mute" style="font-weight:400">— ⑤ 정오표는 수정확률 5단계(전체 · 20 · 40 · 60 · 80% 이상)마다 한 벌씩 나옵니다. 여기서 고친 수정 문구 · 메모가 들어갑니다.</span></h2>
    <div class="row" style="margin-bottom:4px"><button class="big primary" onclick="exportDoc(true)">정오표 만들기 (⑤ 정오표 받기로)</button>
      <label style="cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 12px" title="정오표 검토 HTML 에서 저장한 .json 이나, 「전체 후보」 시트를 고친 정오표 .xlsx">체크본 가져오기
        <input type="file" accept=".json,.xlsx" hidden onchange="importReview(this.files[0]);this.value=''"></label></div>
    <div class="mute" style="margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)">회의할 때는 「정오표_검토.pdf」를 인쇄하거나 「정오표_검토.html」에서 체크한 뒤 [체크 결과 저장] → 여기 「체크본 가져오기」. 엑셀은 「전체 후보」 시트의 반영(O) · 수정 문구 · 메모를 고쳐 올리면 됩니다.</div>
    ${ch ? `<div class="laws" style="margin-bottom:8px"><b>${esc(ch.id)} ${esc(ch.title)}</b><br>${ch.laws.map(l=>`${esc(l.name)}: ${esc(l.old_header||"")} → <b>${esc(l.new_header||"")}</b>`).join("<br>")}</div>` : ""}
    <div class="row" style="margin-bottom:8px">
      <select onchange="EF.min=+this.value;EF.show=200;renderErrata(true)">${[[0,"확률 전체"],[.2,"20% 이상 (유지 숨김)"],[.4,"40% 이상"],[.6,"60% 이상"],[.8,"80% 이상"]].map(([v,t])=>opt(v,t,EF.min)).join("")}</select>
      <button class="iconbtn" onclick="setEdits(true)">보이는 것 모두 체크</button><button class="iconbtn" onclick="setEdits(false)">보이는 것 모두 해제</button><button class="iconbtn" onclick="setEdits(null)">기본값으로</button>
      <span class="mute">보이는 ${shown.length}건 · 전체 ${all.length}건 중 체크 <b id="oncount">${on}</b>건</span></div>
    <div id="paras">${shown.slice(0, EF.show).map(editHtml).join("") || `<div class="empty">이 조건에 맞는 수정 후보가 없습니다.</div>`}</div>
    ${shown.length > EF.show ? `<div class="row" style="margin-top:8px"><button onclick="EF.show+=200;renderErrata(true)">더 보기 (${shown.length - EF.show}건 남음)</button></div>` : ""}
  </div>`;
}
// 기존 → 수정을 글자 단위로 비교해 바뀐 글자만 색칠 (기존 = 붉게, 수정 = 녹색, 나머지 그대로)
function markPair(a, b){
  const n = a.length, m = b.length;
  let ra = [], rb = [];
  if(n * m > 250000){ ra = [[a, 1]]; rb = [[b, 1]] }
  else {
    const L = Array.from({length: n+1}, () => new Uint16Array(m+1));
    for(let i = n-1; i >= 0; i--) for(let j = m-1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
    const push = (r, c, ch) => { const t = r[r.length-1]; if(t && t[1] === ch) t[0] += c; else r.push([c, ch]) };
    let i = 0, j = 0;
    while(i < n || j < m){
      if(i < n && j < m && a[i] === b[j]){ push(ra, a[i++], 0); push(rb, b[j++], 0) }
      else if(j < m && (i >= n || L[i][j+1] >= L[i+1][j])) push(rb, b[j++], 1);
      else push(ra, a[i++], 1);
    }
  }
  const tag = (r, c) => r.map(([t, ch]) => ch ? `<b class="${c}">${esc(t)}</b>` : esc(t)).join("");
  return `${tag(ra, "mx")} → ${b ? tag(rb, "my") : '<b class="mx">(삭제)</b>'}`;
}
function editHtml(e){
  const on = eOn(e), d = DEC[e.id] || {}, id = esc(e.id), book = (ERR.chapters.find(c=>c.id===e.ch)||{}).mode === "book";
  const q = (t, v) => v ? `<span>${t}</span><div class="quote">${esc(v)}</div>` : "";
  return `<div class="para ${on?"":"off"}" id="e${id}"><div class="no">${Math.round(e.p*100)}%</div><div class="body">
    <div class="meta"><label class="adopt"><input type="checkbox" ${on?"checked":""} onchange="decideE('${id}',{apply:this.checked})"> 반영</label>
      <span class="mute">${e.page ? "p."+e.page+" · " : ""}${esc(e.ch)}장 ${esc(e.ch_title.slice(0,16))}</span>
      <span class="tag plain">${esc([e.law, e.article, e.title].filter(Boolean).join(" "))}</span>
      ${e.judge_type ? `<span class="tag plain">${esc(e.judge_type)}</span>` : ""}${d.new_text != null ? `<span class="tag">직접 고침</span>` : ""}</div>
    <div class="txt" style="margin-top:4px">${markPair(e.old, eNew(e))}</div>
    <div class="mute" style="font-size:12.5px;margin-top:2px">${esc(e.reason)}</div>
    <details><summary>근거 보기 · 수정 문구 고치기 · 메모</summary>
      <div class="grid2" style="margin:6px 0">${q("교재", e.book_quote)}${q(book ? "우리 책" : "구 조문", e.old_law_quote)}${q(book ? "개정기본서" : "신 조문", e.new_law_quote)}
        <span>수정 문구</span><input type="text" id="en${id}" value="${esc(eNew(e))}">
        <span>메모</span><input type="text" id="em${id}" value="${esc(d.note||"")}" placeholder="저자 문의 · 회의 결과 등"></div>
      <div class="row" style="margin-top:4px"><button class="iconbtn" onclick="saveE('${id}')">저장</button>
        ${d.new_text != null ? `<button class="iconbtn" onclick="decideE('${id}',{new_text:null},true)">AI 제안으로 되돌리기</button>` : ""}</div></details>
  </div></div>`;
}
function decideE(id, patch, rerender){
  const cur = Object.assign({}, DEC[id]||{}, patch);
  if(cur.new_text === null) delete cur.new_text;
  if(cur.note === undefined) delete cur.note;
  DEC[id] = cur;
  if(rerender) renderErrata(true);
  else { const el = $("e"+id), e = ERR.rows.find(x=>x.id===id); if(el) el.classList.toggle("off", !eOn(e)); const c = $("oncount"); if(c) c.textContent = ERR.rows.filter(eOn).length }
  clearTimeout(decTimer); decTimer = setTimeout(pushDec, 400);
}
function saveE(id){
  const e = ERR.rows.find(x=>x.id===id), v = $("en"+id).value.trim(), note = $("em"+id).value.trim();
  decideE(id, {new_text: v !== e.new ? v : null, note: note || undefined}, true); toast("저장했습니다.");
}
function setEdits(v){
  for(const e of (v === null ? ERR.rows : editsShown())){
    if(v === null){ if(DEC[e.id]) delete DEC[e.id].apply } else DEC[e.id] = Object.assign({}, DEC[e.id]||{}, {apply:v}) }
  renderErrata(true); pushDec();
}
async function pushDec(){
  decTimer = null;
  try{ await api("/api/decide",{method:"POST",body:JSON.stringify({decisions:DEC})}) }catch(e){ toast("체크 저장 실패: "+e.message, 8000) }
}
async function importReview(f){
  if(!f) return;
  try{ const j = await api("/api/import-review",{method:"POST",headers:{"X-Filename":encodeURIComponent(f.name)},body:f});
    DEC = j.decisions; renderErrata(true);
    toast(`체크본을 가져왔습니다: ${j.n}건 반영${j.miss ? ` · 맞추지 못한 줄 ${j.miss}건` : ""}. [체크 끝 → 정오표 만들기]를 누르면 파일에 들어갑니다.`, 9000);
  }catch(e){ toast("가져오기 실패: "+e.message, 9000) }
}
async function exportDoc(go){
  clearTimeout(decTimer); decTimer = null;
  toast("정오표를 만드는 중입니다…", 20000);
  try{ const j = await api("/api/export",{method:"POST",body:JSON.stringify({decisions:DEC})});
    toast(`정오표를 만들었습니다 (${j.levels.map(l=>`${l.name} ${l.n}건`).join(" · ")}). 아래에서 받으세요.`, 7000);
    if(go && route().view !== "download") location.hash = "#/download";
    else { await refresh(); viewKey = null; renderView(true) }
  }catch(e){ toast(e.message, 9000) }
}
async function openErrataDir(){ try{ await api("/api/errata/open",{method:"POST"}) }catch(e){ toast(e.message) } }

/* ---------- ⑤ 정오표 받기 — 만든 파일을 큰 버튼으로 (보기는 새 탭, 엑셀·zip 은 내려받기) ---------- */
function renderDownload(force){
  const key = JSON.stringify(APP.errata);
  if(!force && viewKey === key) return;
  viewKey = key;
  $("view").innerHTML = errHead("⑤ 정오표 받기") + (ERR.rows.length ? getCard()
    : `<div class="card empty">아직 정오표를 만들 수정 후보가 없습니다. <a href="#/judge">② 장별 판정</a>에서 판정을 돌리세요.</div>`);
}
// 수정확률 5단계(④ 필터와 같은 단계)마다 파일 한 벌 — 한 줄에 엑셀 · PDF · 브라우저 · HTML · zip
function getCard(){
  const fs = APP.errata.files, levels = ERR.levels || [];
  const f = (tag, suf) => fs.find(x => x.name.endsWith(`_${tag}_정오표${suf}`));
  const url = (x, dl) => `/errata-files/${encodeURIComponent(x.name)}${dl?"?dl=1":""}`;
  const tile = (x, icon, name, sub, dl, main) => x ? `<a class="${main?"main":""}" href="${url(x, dl)}" ${dl?"":'target="_blank"'}><b>${icon} ${name}</b><span>${sub}</span></a>` : "";
  const first = levels.length && f(levels[0].tag, ".xlsx");
  if(!first) return `<div class="card"><h2>정오표 받기</h2>
    <div class="row"><span>아직 정오표 파일을 만들지 않았습니다. 수정확률 5단계(확률 전체 · 20 · 40 · 60 · 80% 이상)마다 한 벌씩 만듭니다.</span>
    <button class="big primary" onclick="exportDoc()">정오표 만들기</button></div></div>`;
  const rowsHtml = levels.map(lv => {
    const n = ERR.rows.filter(e => e.p >= lv.p).length;
    return `<div style="margin-top:14px"><div style="margin-bottom:6px"><b style="font-size:15px">${esc(lv.name)}</b> <span class="mute">· 후보 ${n}건</span></div>
    <div class="dl">
      ${tile(f(lv.tag, ".xlsx"), "📊", "엑셀 정오표", "저자에게 보내기", true, lv.p === .6)}
      ${tile(f(lv.tag, "_검토.pdf"), "🖨", "PDF 정오표", "인쇄해서 회의 · 메모칸", false)}
      ${tile(f(lv.tag, "_검토.html"), "✔", "브라우저 체크하기", "같이 보며 고친 뒤 [체크 결과 저장]", false)}
      ${tile(f(lv.tag, "_게시판.html"), "📋", "HTML 정오표", "게시판에 붙이기", false)}
      <a href="/zip?level=${encodeURIComponent(lv.tag)}"><b>⬇ 이 줄 한 번에 받기</b><span>위 파일 모두 · zip 하나</span></a>
    </div></div>`;
  }).join("");
  return `<div class="card"><h2>정오표 받기 <span class="mute" style="font-weight:400">— 수정확률 단계마다 한 줄 · 그 단계 이상인 후보가 모두 들어갑니다 · ${esc(first.time)}에 만든 파일</span></h2>
    ${APP.errata.stale ? `<div class="alert" style="margin:0 0 8px"><b>④에서 고친 뒤 아직 파일을 다시 만들지 않았습니다.</b> 아래 파일은 고치기 전 내용입니다.
      <button class="primary" style="margin-left:8px" onclick="exportDoc()">다시 만들기</button></div>` : ""}
    ${rowsHtml}
    <div class="row" style="margin-top:14px"><button class="iconbtn" onclick="exportDoc()">다시 만들기</button>
      <button class="iconbtn" onclick="openErrataDir()">폴더 열기</button></div></div>`;
}

window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", e=>{ e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if(f && route().view==="book" && /\.pdf$/i.test(f.name)) uploadBook(f);
  else if(f) toast("파일은 점선 칸이나 '비교 자료' 카드 위에 놓아 주세요.");
});
window.addEventListener("hashchange", ()=>{
  if(decTimer){ clearTimeout(decTimer); decTimer = null; pushDec() }  // 안 보낸 체크는 화면을 떠나기 전에 저장
  chRendered=null; CHS=null; ERR=null; viewKey=null; refresh().then(()=>renderView(true)) });
refresh().then(()=>renderView(true));
</script></body></html>
